<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1d1d1f;
    }

    .calendar {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
      width: 360px;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    .calendar__header {
      background: #1d1d1f;
      color: #ffffff;
      padding: 20px 24px 16px;
    }

    .calendar__nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .calendar__title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      border-radius: 6px;
      padding: 4px 8px;
      transition: background 0.15s;
    }

    .calendar__title:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .calendar__btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .calendar__btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .calendar__btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .calendar__today-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      padding: 0 8px;
    }

    /* ── Weekday row ── */
    .calendar__weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 12px 12px 0;
    }

    .calendar__weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding-bottom: 8px;
    }

    /* ── Days grid ── */
    .calendar__days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0 12px 16px;
      gap: 2px;
    }

    .calendar__day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 400;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      position: relative;
    }

    .calendar__day:empty {
      cursor: default;
    }

    .calendar__day--other-month {
      color: #c7c7cc;
    }

    .calendar__day--other-month:hover {
      background: #f2f2f7;
      color: #8e8e93;
    }

    .calendar__day:not(:empty):hover:not(.calendar__day--today):not(.calendar__day--selected) {
      background: #f2f2f7;
    }

    .calendar__day--today {
      background: #f2f2f7;
      font-weight: 700;
      color: #007aff;
    }

    .calendar__day--today::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #007aff;
    }

    .calendar__day--selected {
      background: #007aff;
      color: #ffffff;
      font-weight: 600;
    }

    .calendar__day--selected::after {
      display: none;
    }

    .calendar__day--selected:hover {
      background: #0062cc;
    }

    .calendar__day--today.calendar__day--selected {
      background: #007aff;
      color: #ffffff;
    }

    .calendar__day--weekend {
      color: #8e8e93;
    }

    .calendar__day--weekend.calendar__day--selected {
      color: #ffffff;
    }

    /* ── Events dot indicators ── */
    .calendar__day--has-event::before {
      content: "";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff9f0a;
    }

    .calendar__day--selected.calendar__day--has-event::before {
      background: rgba(255, 255, 255, 0.8);
    }

    /* ── Footer / selected info ── */
    .calendar__footer {
      border-top: 1px solid #f2f2f7;
      padding: 12px 20px 16px;
      min-height: 56px;
    }

    .calendar__selected-date {
      font-size: 13px;
      font-weight: 500;
      color: #1d1d1f;
    }

    .calendar__selected-date span {
      color: #8e8e93;
      font-weight: 400;
    }

    .calendar__events-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .calendar__event {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #3c3c43;
    }

    .calendar__event-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Year picker overlay ── */
    .calendar__year-picker {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .calendar__year-item {
      padding: 8px 4px;
      text-align: center;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .calendar__year-item:hover {
      background: #f2f2f7;
    }

    .calendar__year-item--current {
      background: #007aff;
      color: #ffffff;
      font-weight: 600;
    }

    .calendar__year-item--current:hover {
      background: #0062cc;
    }

    /* ── Animations ── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .calendar__days, .calendar__weekdays, .calendar__year-picker {
      animation: fadeSlideIn 0.18s ease;
    }
  </style>
</head>
<body>

<div class="calendar" id="calendar">
  <div class="calendar__header">
    <div class="calendar__nav">
      <button class="calendar__btn" id="prevBtn" aria-label="Previous month">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="calendar__title" id="calTitle" role="button" tabindex="0" aria-label="Select year"></div>
      <button class="calendar__btn" id="nextBtn" aria-label="Next month">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="calendar__today-label" id="todayLabel"></div>
  </div>

  <div id="calBody"></div>

  <div class="calendar__footer" id="calFooter"></div>
</div>

<script>
  const DAYS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
  const MONTHS = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];

  // Sample event data: key = "YYYY-M-D"
  const EVENTS = {
    [`${new Date().getFullYear()}-${new Date().getMonth()}-${new Date().getDate()}`]: [
      { label: "Team standup", color: "#007aff" }
    ],
    [`${new Date().getFullYear()}-${new Date().getMonth()}-${new Date().getDate() + 3}`]: [
      { label: "Design review", color: "#ff9f0a" },
      { label: "Lunch with team", color: "#34c759" }
    ],
    [`${new Date().getFullYear()}-${new Date().getMonth()}-${new Date().getDate() - 2}`]: [
      { label: "Sprint planning", color: "#ff375f" }
    ],
    [`${new Date().getFullYear()}-${new Date().getMonth() + 1}-10`]: [
      { label: "Quarterly review", color: "#5856d6" }
    ],
  };

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = null;
  let showingYearPicker = false;

  function eventKey(y, m, d) { return `${y}-${m}-${d}`; }
  function getEvents(y, m, d) { return EVENTS[eventKey(y, m, d)] || []; }

  function renderCalendar() {
    document.getElementById("calTitle").textContent =
      `${MONTHS[viewMonth]} ${viewYear}`;

    document.getElementById("todayLabel").textContent =
      `Today is ${MONTHS[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;

    if (showingYearPicker) {
      renderYearPicker();
    } else {
      renderDaysGrid();
    }

    renderFooter();
  }

  function renderDaysGrid() {
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevDays = new Date(viewYear, viewMonth, 0).getDate();

    let html = `<div class="calendar__weekdays">`;
    DAYS.forEach(d => { html += `<div class="calendar__weekday">${d}</div>`; });
    html += `</div><div class="calendar__days">`;

    // Leading empty cells (prev month)
    for (let i = 0; i < firstDay; i++) {
      const day = prevDays - firstDay + 1 + i;
      const [y, m] = viewMonth === 0 ? [viewYear - 1, 11] : [viewYear, viewMonth - 1];
      html += dayCell(day, y, m, true, i);
    }

    // Current month days
    for (let d = 1; d <= daysInMonth; d++) {
      html += dayCell(d, viewYear, viewMonth, false, firstDay + d - 1);
    }

    // Trailing empty cells (next month)
    const total = firstDay + daysInMonth;
    const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
    const [ny, nm] = viewMonth === 11 ? [viewYear + 1, 0] : [viewYear, viewMonth + 1];
    for (let d = 1; d <= trailing; d++) {
      html += dayCell(d, ny, nm, true, total + d - 1);
    }

    html += `</div>`;
    document.getElementById("calBody").innerHTML = html;

    document.querySelectorAll(".calendar__day[data-date]").forEach(el => {
      el.addEventListener("click", () => {
        const [y, m, d] = el.dataset.date.split("-").map(Number);
        selectedDate = new Date(y, m, d);
        viewYear = y;
        viewMonth = m;
        renderCalendar();
      });
    });
  }

  function dayCell(day, y, m, otherMonth, colIndex) {
    const isToday = y === today.getFullYear() && m === today.getMonth() && day === today.getDate();
    const isSelected = selectedDate &&
      y === selectedDate.getFullYear() && m === selectedDate.getMonth() && day === selectedDate.getDate();
    const isWeekend = (colIndex % 7 === 0 || colIndex % 7 === 6);
    const events = getEvents(y, m, day);
    const hasEvent = events.length > 0;

    let cls = "calendar__day";
    if (otherMonth) cls += " calendar__day--other-month";
    if (isToday) cls += " calendar__day--today";
    if (isSelected) cls += " calendar__day--selected";
    if (isWeekend && !otherMonth) cls += " calendar__day--weekend";
    if (hasEvent) cls += " calendar__day--has-event";

    return `<div class="${cls}" data-date="${y}-${m}-${day}" role="button" tabindex="0" aria-label="${MONTHS[m]} ${day}, ${y}">${day}</div>`;
  }

  function renderYearPicker() {
    const startYear = viewYear - 7;
    let html = `<div class="calendar__year-picker">`;
    for (let y = startYear; y < startYear + 16; y++) {
      const isCurrent = y === viewYear;
      html += `<div class="calendar__year-item${isCurrent ? " calendar__year-item--current" : ""}"
        data-year="${y}" role="button" tabindex="0">${y}</div>`;
    }
    html += `</div>`;
    document.getElementById("calBody").innerHTML = html;

    document.querySelectorAll(".calendar__year-item").forEach(el => {
      el.addEventListener("click", () => {
        viewYear = parseInt(el.dataset.year);
        showingYearPicker = false;
        renderCalendar();
      });
    });
  }

  function renderFooter() {
    const footer = document.getElementById("calFooter");
    if (!selectedDate) {
      footer.innerHTML = `<div class="calendar__selected-date"><span>Select a date</span></div>`;
      return;
    }

    const y = selectedDate.getFullYear();
    const m = selectedDate.getMonth();
    const d = selectedDate.getDate();
    const dow = selectedDate.toLocaleDateString("en-US", { weekday: "long" });
    const events = getEvents(y, m, d);

    let html = `<div class="calendar__selected-date">${dow}, ${MONTHS[m]} ${d}, ${y}</div>`;

    if (events.length > 0) {
      html += `<div class="calendar__events-list">`;
      events.forEach(ev => {
        html += `<div class="calendar__event">
          <span class="calendar__event-dot" style="background:${ev.color}"></span>
          ${ev.label}
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="calendar__events-list"><div class="calendar__event"><span style="color:#c7c7cc">No events</span></div></div>`;
    }

    footer.innerHTML = html;
  }

  // Nav buttons
  document.getElementById("prevBtn").addEventListener("click", () => {
    if (showingYearPicker) { showingYearPicker = false; }
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    if (showingYearPicker) { showingYearPicker = false; }
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  // Year picker toggle
  document.getElementById("calTitle").addEventListener("click", () => {
    showingYearPicker = !showingYearPicker;
    renderCalendar();
  });

  // Keyboard support
  document.addEventListener("keydown", (e) => {
    if (!selectedDate) return;
    let delta = 0;
    if (e.key === "ArrowLeft")  delta = -1;
    if (e.key === "ArrowRight") delta =  1;
    if (e.key === "ArrowUp")    delta = -7;
    if (e.key === "ArrowDown")  delta =  7;
    if (delta === 0) return;

    e.preventDefault();
    selectedDate = new Date(selectedDate.getTime() + delta * 86400000);
    viewYear = selectedDate.getFullYear();
    viewMonth = selectedDate.getMonth();
    renderCalendar();
  });

  renderCalendar();
</script>
</body>
</html>
